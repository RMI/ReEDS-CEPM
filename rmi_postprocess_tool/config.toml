[general]
# Folder containing the two ReEDS run folders.
runs_root = "/Users/shuestis/Library/CloudStorage/OneDrive-RMI/CEP (Clean Energy Planning) - VM-Outputs"

# Output CSV path. Relative paths are resolved relative to this config file.
output_csv = "primary_metrics_comparison.csv"

# ReEDS system cost outputs are reported in 2004$.
dollar_year = 2026
# Dollar conversion taken from US Bureau of Labor Statistics CPI Inflation Calculator
dollar_conversion_factor = 1.8

# Years can be "shared" or an explicit list, e.g. [2024, 2026, 2032].
years = "shared"

# States to include in the output. Use two-letter postal abbreviations e.g. ['NM'] or ['NM','AZ']
states = ['AZ','NM']

# How to calculate percent difference.
# Currently supported: "relative_to_first_run".
diff_method = "relative_to_first_run"

[[runs]]
name = "USA_optimized"
path = "v20260717_USA_optimized"

[[runs]]
name = "USA_gas"
path = "v20260720_USA_gas"

[metrics]
# Use ["all"] for the full default primary metric set.
# Or list metric groups explicitly:
# ["system_cost", "average_electricity_cost", "co2_emissions", "generation_mix",
#  "capacity_additions", "reserve_margin", "transmission_utilization",
#  "curtailment", "fuel_consumption"]
include = ["all"]
